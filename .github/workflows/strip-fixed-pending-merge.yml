# Reusable: when an issue closes, drop `fixed-pending-merge` (a closed issue is
# never "pending merge" — the usual path is a Fixes #N trailer auto-closing it on
# merge to main).  Callers add a 3-line stub (see README) supplying the
# `issues: [closed]` trigger.  Mirror of apply-fixed-pending-merge.
name: Strip fixed-pending-merge (reusable)

on:
  workflow_call:

permissions:
  issues: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the label if present
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          if gh issue view "$NUMBER" --repo "$REPO" --json labels -q '.labels[].name' 2>/dev/null \
               | grep -qFx 'fixed-pending-merge'; then
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label "fixed-pending-merge"
          fi
